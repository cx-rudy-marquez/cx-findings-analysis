{% macro icon(name) -%}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{% if name == 'projects' %}<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
{% elif name == 'runs' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{% elif name == 'settings' %}<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="8" cy="18" r="2"/>
{% elif name == 'search' %}<circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/>
{% else %}<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>{% endif %}
</svg>
{%- endmacro %}
<aside class="sidebar no-print" aria-label="Workspace">
  <div>
    <a class="workspace" href="/" aria-label="Findings Analysis Impact home" title="Findings Analysis Impact">
      <span class="workspace-mark">{{ icon('projects') }}</span>
      <span class="workspace-name">Findings Analysis<small>Impact workspace</small></span>
    </a>
    <div class="meta">{{ tenant }}</div>
  </div>
  <button class="command-trigger secondary" type="button" data-open-command aria-label="Search and navigate" aria-haspopup="dialog" aria-controls="command-palette" aria-keyshortcuts="Meta+k Control+k" hidden>
    {{ icon('search') }}<span class="nav-label">Search</span><kbd aria-hidden="true">⌘ K</kbd>
  </button>
  <nav class="sidebar-nav" aria-label="Main">
    <p class="nav-section">Workspace</p>
    <a href="/" class="nav-item" aria-label="Projects" title="Projects" {% if tab == 'projects' %}aria-current="page"{% endif %}>{{ icon('projects') }}<span class="nav-label">Projects</span></a>
    <a href="/runs" class="nav-item" aria-label="Recent runs" title="Recent runs" {% if tab == 'runs' %}aria-current="page"{% endif %}>{{ icon('runs') }}<span class="nav-label">Recent runs</span></a>
    <a href="/settings" class="nav-item" aria-label="Settings" title="Settings" {% if tab == 'settings' %}aria-current="page"{% endif %}>{{ icon('settings') }}<span class="nav-label">Settings</span></a>
  </nav>
  <div class="sidebar-bottom">
    <button type="button" class="sidebar-toggle secondary" aria-label="Collapse sidebar" title="Collapse sidebar" aria-expanded="true" hidden>{{ icon('sidebar') }}</button>
  </div>
</aside>
<dialog id="command-palette" class="command-palette no-print" aria-labelledby="command-title">
  <div class="command-heading"><h2 id="command-title">Go to…</h2><button type="button" class="secondary" data-close-command aria-label="Close search">Esc</button></div>
  <input id="command-query" type="search" placeholder="Search projects or navigate…" aria-label="Search projects and pages" role="combobox" aria-autocomplete="list" aria-expanded="true" aria-controls="command-results" autocomplete="off">
  <div id="command-results" class="command-results" role="listbox" aria-label="Pages and projects"></div>
  <div class="command-footer"><span><kbd>↑ ↓</kbd> Navigate</span><span><kbd>Enter</kbd> Open</span><span><kbd>Esc</kbd> Close</span></div>
</dialog>
